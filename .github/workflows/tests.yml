name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gawk openssh-server && sudo mkdir -p /run/sshd
      - run: bash tests/check-cours.sh
      - run: bash tests/run-solution.sh
      - run: bash tests/casebook-docker.sh
  simulateur-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y gawk
      - run: bash tests/web/run-all.sh 6
      - name: Test navigateur (mode Expert, journal)
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --prefix /tmp/pw playwright
          (cd site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-expert.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-install.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-casebook.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-defi01.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-twin.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-bilan.mjs
          NODE_PATH=/tmp/pw/node_modules CHROME="$(command -v google-chrome || command -v chromium)" node tests/web/ui-sql.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/docker-integration.sh
